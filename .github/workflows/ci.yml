# CI 採 quality gate -> backend/frontend 並行：
# 先跑 secret scan，避免含敏感字串的變更進入後續流程。
name: ci

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, 'fix/**', 'feat/**', 'chore/**', 'perf/**']
  workflow_dispatch:

jobs:
  # quality job 失敗時，其它 job 不應繼續執行（透過 needs 控制）。
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secret scan
        run: .github/scripts/secret-scan.sh

  backend:
    runs-on: ubuntu-latest
    # 後端測試依賴 quality gate，避免在可預期失敗的 PR 上浪費 runner。
    needs: [quality]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore BankReporting.sln
      - name: Test
        run: dotnet test BankReporting.sln -c Release --no-restore

  frontend:
    runs-on: ubuntu-latest
    # 前端僅做 install+build，作為最小可部署性檢查。
    needs: [quality]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend
