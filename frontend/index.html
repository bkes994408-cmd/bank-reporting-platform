<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bank Reporting Admin Console</title>
  <link rel="stylesheet" href="./src/styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand__logo">BR</div>
        <div>
          <h1>Bank Reporting</h1>
          <p>Admin Console</p>
        </div>
      </div>

      <div class="sidebar__section">
        <label for="apiBase">API Base</label>
        <input id="apiBase" value="http://localhost:5000" />
      </div>

      <nav class="sidebar__nav" aria-label="Main navigation">
        <button id="tabOverviewBtn" class="nav-btn active" data-tab="overview">總覽</button>
        <button id="tabUsersBtn" class="nav-btn" data-tab="users">使用者管理</button>
        <button id="tabAuditBtn" class="nav-btn" data-tab="audit">稽核紀錄</button>
      </nav>

      <div class="sidebar__footer">
        <p id="whoami" class="muted"></p>
        <div class="row">
          <button id="refreshBtn">重新整理</button>
          <button id="logoutBtn" class="warn">Logout</button>
        </div>
      </div>
    </aside>

    <main class="content">
      <section id="loginCard" class="panel panel--narrow">
        <header class="panel__header">
          <h2>登入</h2>
          <p class="muted">會優先使用 X-Auth-Token；若後端已有安全 cookie 也可嘗試載入。</p>
        </header>
        <div class="grid-form">
          <input id="email" placeholder="email" value="admin@bank.local" />
          <input id="password" type="password" placeholder="password" value="Admin#12345678" />
          <input id="mfaCode" placeholder="MFA code (optional)" />
          <button id="loginBtn" class="primary">Login</button>
        </div>
      </section>

      <div id="app" class="hidden">
        <div id="topStatus" class="status-line muted" aria-live="polite"></div>

        <section id="tabOverview" class="panel">
          <header class="panel__header">
            <h2>管理總覽</h2>
            <p class="muted">快速掌握帳號狀態、稽核活動與目前登入資訊。</p>
          </header>
          <div id="kpi" class="kpi-grid"></div>
          <h3>最近 10 筆稽核事件</h3>
          <div id="recentAudit" class="table-wrap"></div>
        </section>

        <section id="tabUsers" class="panel hidden">
          <header class="panel__header row row--between">
            <h2>使用者管理</h2>
            <div class="row">
              <input id="userQuery" placeholder="搜尋 email / name / institution" />
              <select id="statusFilter">
                <option value="all">全部狀態</option>
                <option value="PendingApproval">PendingApproval</option>
                <option value="Active">Active</option>
                <option value="Rejected">Rejected</option>
                <option value="Locked">Locked</option>
              </select>
            </div>
          </header>

          <div class="subpanel">
            <div class="row row--between row--wrap">
              <div>
                <strong>MFA 管理政策</strong>
                <p id="mfaPolicyHint" class="muted">載入中...</p>
              </div>
              <div class="row row--wrap">
                <select id="mfaScope">
                  <option value="Disabled">Disabled</option>
                  <option value="AdminOnly">AdminOnly</option>
                  <option value="AdminAndSupervisor">AdminAndSupervisor</option>
                  <option value="AllUsers">AllUsers</option>
                </select>
                <label><input id="mfaEnforce" type="checkbox" /> 強制套用在授權端點</label>
                <label><input id="mfaRevoke" type="checkbox" /> 立即撤銷不合規 sessions</label>
                <button id="updateMfaBtn" class="primary">更新政策</button>
              </div>
            </div>
          </div>

          <div id="usersTableWrap" class="table-wrap"><table id="usersTable"></table></div>
        </section>

        <section id="tabAudit" class="panel hidden">
          <header class="panel__header row row--between">
            <h2>稽核紀錄</h2>
            <div class="row">
              <input id="auditActionFilter" placeholder="action contains..." />
              <select id="auditTop">
                <option value="100">100</option>
                <option value="200" selected>200</option>
                <option value="500">500</option>
              </select>
              <button id="loadAuditBtn">載入</button>
            </div>
          </header>
          <div id="auditTableWrap" class="table-wrap"><table id="auditTable"></table></div>
        </section>
      </div>
    </main>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
