<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bank Reporting Admin Console</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --line: #d7deea;
      --text: #1f2a44;
      --sub: #6a768f;
      --primary: #265dff;
      --ok: #0f9d58;
      --warn: #d97706;
      --danger: #c62828;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 20px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 14px; }
    h1, h2, h3 { margin: 0 0 8px; }
    .muted { color: var(--sub); font-size: 13px; }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .grow { flex: 1; }
    input, select, button {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 14px;
      background: #fff;
    }
    button { cursor: pointer; }
    button.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
    button.ok { background: var(--ok); color: #fff; border-color: var(--ok); }
    button.warn { background: var(--warn); color: #fff; border-color: var(--warn); }
    button.danger { background: var(--danger); color: #fff; border-color: var(--danger); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .nav button.active { background: #e9efff; border-color: #b9c9ff; }
    .grid { display: grid; grid-template-columns: repeat(4, minmax(120px, 1fr)); gap: 10px; }
    .kpi { border: 1px solid var(--line); border-radius: 10px; padding: 12px; background: #fcfdff; }
    .kpi .v { font-size: 22px; font-weight: 700; margin-top: 4px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { border-bottom: 1px solid var(--line); padding: 8px 6px; text-align: left; vertical-align: top; }
    th { background: #f8fafe; position: sticky; top: 0; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; border: 1px solid var(--line); }
    .badge.pending { background: #fff7e6; }
    .badge.active { background: #e9f9ef; }
    .badge.locked, .badge.rejected { background: #ffebee; }
    #usersTableWrap, #auditTableWrap { max-height: 58vh; overflow: auto; border: 1px solid var(--line); border-radius: 8px; }
    .hidden { display: none !important; }
    #toast { position: fixed; right: 18px; bottom: 18px; background: #1f2a44; color: #fff; padding: 10px 12px; border-radius: 8px; max-width: 480px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="row">
        <div class="grow">
          <h1>Bank Reporting 管理介面</h1>
          <div class="muted">聚焦管理工作：登入/Session、使用者審核、稽核紀錄、快速總覽。</div>
        </div>
        <div>
          <label class="muted">API Base</label><br />
          <input id="apiBase" value="http://localhost:5000" style="min-width:240px" />
        </div>
      </div>
    </div>

    <div id="loginCard" class="card">
      <h3>登入</h3>
      <div class="row">
        <input id="email" placeholder="email" value="admin@bank.local" />
        <input id="password" type="password" placeholder="password" value="Admin#12345678" />
        <input id="mfaCode" placeholder="MFA code (optional)" style="width:160px" />
        <button class="primary" onclick="login()">Login</button>
      </div>
      <div class="muted">會優先使用 X-Auth-Token；若後端已有安全 cookie 也可嘗試載入。</div>
    </div>

    <div id="app" class="hidden">
      <div class="card row nav">
        <button id="tabOverviewBtn" class="active" onclick="showTab('overview')">總覽</button>
        <button id="tabUsersBtn" onclick="showTab('users')">使用者管理</button>
        <button id="tabAuditBtn" onclick="showTab('audit')">稽核紀錄</button>
        <div class="grow"></div>
        <div id="whoami" class="muted"></div>
        <button onclick="refreshAll()">重新整理</button>
        <button class="warn" onclick="logout()">Logout</button>
      </div>

      <div id="tabOverview" class="card">
        <h3>管理總覽</h3>
        <div id="kpi" class="grid"></div>
        <h4 style="margin-top:16px">最近 10 筆稽核事件</h4>
        <div id="recentAudit"></div>
      </div>

      <div id="tabUsers" class="card hidden">
        <div class="row" style="margin-bottom:8px">
          <h3 class="grow">使用者管理</h3>
          <input id="userQuery" placeholder="搜尋 email / name / institution" oninput="renderUsers()" />
          <select id="statusFilter" onchange="renderUsers()">
            <option value="all">全部狀態</option>
            <option value="PendingApproval">PendingApproval</option>
            <option value="Active">Active</option>
            <option value="Rejected">Rejected</option>
            <option value="Locked">Locked</option>
          </select>
        </div>
        <div id="usersTableWrap"><table id="usersTable"></table></div>
      </div>

      <div id="tabAudit" class="card hidden">
        <div class="row" style="margin-bottom:8px">
          <h3 class="grow">稽核紀錄</h3>
          <input id="auditActionFilter" placeholder="action contains..." oninput="renderAudit()" />
          <select id="auditTop">
            <option value="100">100</option>
            <option value="200" selected>200</option>
            <option value="500">500</option>
          </select>
          <button onclick="loadAudit()">載入</button>
        </div>
        <div id="auditTableWrap"><table id="auditTable"></table></div>
      </div>
    </div>
  </div>

  <div id="toast" class="hidden"></div>

  <script>
    let token = sessionStorage.getItem('admin_token') || '';
    let currentUser = null;
    let users = [];
    let audits = [];

    const byId = (id) => document.getElementById(id);
    const esc = (s) => (s ?? '').toString().replace(/[&<>\"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));

    function apiBase() {
      return byId('apiBase').value.trim().replace(/\/$/, '');
    }

    function toast(msg, isErr = false) {
      const t = byId('toast');
      t.textContent = msg;
      t.classList.remove('hidden');
      t.style.background = isErr ? '#c62828' : '#1f2a44';
      setTimeout(() => t.classList.add('hidden'), 2600);
    }

    async function api(path, opt = {}) {
      const headers = { 'Content-Type': 'application/json', ...(opt.headers || {}) };
      if (token) headers['X-Auth-Token'] = token;
      const res = await fetch(apiBase() + path, { ...opt, headers, credentials: 'include' });
      const raw = await res.text();
      let body = raw;
      try { body = raw ? JSON.parse(raw) : null; } catch {}
      if (!res.ok) {
        const msg = typeof body === 'string' ? body : (body?.message || JSON.stringify(body));
        throw new Error(`${res.status} ${msg}`);
      }
      return body;
    }

    function showTab(tab) {
      ['overview', 'users', 'audit'].forEach(x => {
        byId(`tab${x[0].toUpperCase() + x.slice(1)}`).classList.toggle('hidden', x !== tab);
        byId(`tab${x[0].toUpperCase() + x.slice(1)}Btn`).classList.toggle('active', x === tab);
      });
    }

    function statusBadge(status) {
      const cls = status?.toLowerCase().includes('pending') ? 'pending' : status?.toLowerCase();
      return `<span class="badge ${esc(cls)}">${esc(status || '-')}</span>`;
    }

    async function login() {
      try {
        const body = {
          email: byId('email').value.trim(),
          password: byId('password').value,
          mfaCode: byId('mfaCode').value.trim() || null
        };
        const data = await api('/auth/login', { method: 'POST', body: JSON.stringify(body) });
        token = data.token || token;
        if (token) sessionStorage.setItem('admin_token', token);
        currentUser = data.user;
        byId('whoami').textContent = `${data.user?.name || ''} (${data.user?.role || ''})`;
        byId('loginCard').classList.add('hidden');
        byId('app').classList.remove('hidden');
        await refreshAll();
        toast('登入成功');
      } catch (e) {
        toast(`登入失敗：${e.message}`, true);
      }
    }

    async function logout() {
      try { await api('/auth/logout', { method: 'POST' }); } catch {}
      token = '';
      sessionStorage.removeItem('admin_token');
      byId('app').classList.add('hidden');
      byId('loginCard').classList.remove('hidden');
      toast('已登出');
    }

    async function loadUsers() {
      users = await api('/admin/users');
      renderUsers();
    }

    async function loadAudit() {
      const top = Number(byId('auditTop').value || 200);
      audits = await api(`/admin/audit-logs?top=${top}`);
      renderAudit();
      renderRecentAudit();
    }

    function renderOverview() {
      const pending = users.filter(u => u.status === 'PendingApproval').length;
      const active = users.filter(u => u.status === 'Active').length;
      const locked = users.filter(u => u.status === 'Locked').length;
      const admins = users.filter(u => u.role === 'Admin').length;
      byId('kpi').innerHTML = [
        ['總使用者', users.length],
        ['待審核', pending],
        ['已啟用', active],
        ['鎖定', locked],
        ['管理員', admins],
        ['稽核事件', audits.length],
        ['本次登入角色', currentUser?.role || '-'],
        ['本次登入信箱', currentUser?.email || '-']
      ].map(([k, v]) => `<div class="kpi"><div class="muted">${esc(k)}</div><div class="v">${esc(v)}</div></div>`).join('');
    }

    function renderRecentAudit() {
      const rows = audits.slice(0, 10).map(a => `<tr>
        <td>${esc(new Date(a.at).toLocaleString())}</td>
        <td>${esc(a.action)}</td>
        <td>${esc(a.userName || '-')}</td>
        <td>${esc(a.entityType)} / ${esc(a.entityId)}</td>
        <td>${esc(a.summary)}</td>
        <td>${esc(a.ipAddress || '-')}</td>
      </tr>`).join('');
      byId('recentAudit').innerHTML = `<table><thead><tr><th>時間</th><th>Action</th><th>User</th><th>Entity</th><th>Summary</th><th>IP</th></tr></thead><tbody>${rows || '<tr><td colspan="6" class="muted">無資料</td></tr>'}</tbody></table>`;
    }

    function renderUsers() {
      const q = byId('userQuery').value.trim().toLowerCase();
      const status = byId('statusFilter').value;
      const filtered = users.filter(u => {
        const matchQ = !q || [u.name, u.email, u.institutionCode, u.department, u.title].some(x => (x || '').toLowerCase().includes(q));
        const matchS = status === 'all' || u.status === status;
        return matchQ && matchS;
      });

      const rows = filtered.map(u => {
        const pendingControls = u.status === 'PendingApproval' ? `
          <div class="row" style="margin-top:6px">
            <select id="role-${u.id}">
              ${['Clerk','Supervisor','ReadOnly','Admin'].map(r => `<option value="${r}" ${u.role===r?'selected':''}>${r}</option>`).join('')}
            </select>
            <input id="inst-${u.id}" value="${esc(u.institutionCode || '')}" placeholder="Institution" style="width:110px" />
            <button class="ok" onclick="approveUser('${u.id}', true)">核准</button>
            <button class="danger" onclick="approveUser('${u.id}', false)">拒絕</button>
          </div>` : '';

        return `<tr>
          <td>${esc(u.name)}<div class="muted">${esc(u.email)}</div></td>
          <td>${statusBadge(u.status)}</td>
          <td>${esc(u.role)}</td>
          <td>${esc(u.institutionCode || '-')}</td>
          <td>${esc(u.department || '-')} / ${esc(u.title || '-')}</td>
          <td>${u.mfaEnabled ? '✅' : '❌'}</td>
          <td>${u.isAdUser ? 'AD' : 'Local'}</td>
          <td>
            <button onclick="revokeSessions('${u.id}')">Revoke Sessions</button>
            ${pendingControls}
          </td>
        </tr>`;
      }).join('');

      byId('usersTable').innerHTML = `<thead><tr>
        <th>使用者</th><th>狀態</th><th>角色</th><th>機構</th><th>部門/職稱</th><th>MFA</th><th>Auth</th><th>操作</th>
      </tr></thead><tbody>${rows || '<tr><td colspan="8" class="muted">無符合資料</td></tr>'}</tbody>`;

      renderOverview();
    }

    function renderAudit() {
      const q = byId('auditActionFilter').value.trim().toLowerCase();
      const filtered = audits.filter(a => !q || (a.action || '').toLowerCase().includes(q) || (a.summary || '').toLowerCase().includes(q));
      const rows = filtered.map(a => `<tr>
        <td>${esc(new Date(a.at).toLocaleString())}</td>
        <td>${esc(a.action)}</td>
        <td>${esc(a.userName || '-')}</td>
        <td>${esc(a.entityType)}</td>
        <td>${esc(a.entityId)}</td>
        <td>${esc(a.summary)}</td>
        <td>${esc(a.ipAddress || '-')}</td>
      </tr>`).join('');
      byId('auditTable').innerHTML = `<thead><tr><th>時間</th><th>Action</th><th>User</th><th>Entity</th><th>ID</th><th>Summary</th><th>IP</th></tr></thead>
        <tbody>${rows || '<tr><td colspan="7" class="muted">無資料</td></tr>'}</tbody>`;
      renderOverview();
    }

    async function approveUser(userId, approve) {
      try {
        const role = byId(`role-${userId}`)?.value || 'Clerk';
        const institutionCode = byId(`inst-${userId}`)?.value?.trim() || '';
        if (!institutionCode) throw new Error('InstitutionCode 必填');
        await api(`/admin/users/${userId}/approve`, {
          method: 'POST',
          body: JSON.stringify({ approve, role, institutionCode })
        });
        toast(approve ? '已核准帳號' : '已拒絕帳號');
        await refreshAll();
      } catch (e) {
        toast(`操作失敗：${e.message}`, true);
      }
    }

    async function revokeSessions(userId) {
      if (!confirm('確定要撤銷此使用者所有 active sessions？')) return;
      try {
        const data = await api(`/admin/users/${userId}/revoke-sessions`, { method: 'POST' });
        toast(`已撤銷 ${data.revokedCount} 個 sessions`);
        await loadAudit();
      } catch (e) {
        toast(`撤銷失敗：${e.message}`, true);
      }
    }

    async function refreshAll() {
      try {
        await loadUsers();
        await loadAudit();
      } catch (e) {
        toast(`資料載入失敗：${e.message}`, true);
      }
    }

    async function bootstrapSession() {
      if (!token) return;
      byId('loginCard').classList.add('hidden');
      byId('app').classList.remove('hidden');
      byId('whoami').textContent = '使用既有 token session';
      await refreshAll();
    }

    bootstrapSession();
  </script>
</body>
</html>
